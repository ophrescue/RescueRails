version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  versioning-strategy: lockfile-only
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  # Major-version bumps (including of transitive/indirect gems swept along
  # inside another gem's patch/minor PR - e.g. connection_pool 2.x -> 3.0
  # riding inside a 2026-07-31 "activestorage patch bump" PR broke
  # MemCacheStore in production) must go through a deliberate, reviewed
  # `bundle update <gem> --conservative` pass, never an automated PR.
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
  - dependency-name: rubocop-rspec
    versions:
    - "< 1.31, >= 1.30.a"
  - dependency-name: chartkick
    versions:
    - 4.0.0
    - 4.0.2
  - dependency-name: stripe
    versions:
    - 5.31.0
  - dependency-name: database_cleaner
    versions:
    - 2.0.0

- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
