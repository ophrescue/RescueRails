name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  test:
    services:
      postgres:
        image: postgres:16.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-22.04
    env:
      # This app has no config/master.key/credentials.yml.enc, so
      # secret_key_base for the test env is normally derived by Rails'
      # own generate_local_secret fallback (config/application/
      # configuration.rb), which does a non-atomic check-then-write
      # against a single shared tmp/local_secret.txt. On a fresh CI
      # checkout that file doesn't exist yet, and parallel:create /
      # parallel_rspec both boot several Rails processes concurrently --
      # if two race to create it, a loser can read back an empty file
      # and Rails raises `secret_key_base ... must be a type of String`.
      # Setting it explicitly here skips that fallback entirely, so nothing
      # is ever generated or raced on. Value is a fixed, non-secret
      # placeholder -- fine for test env, never used in production.
      SECRET_KEY_BASE: 0833c84aa1b0985ffea5ac8fa04885893b37ba3b5dd9d07e2e75460a24d3ba507381f695e803eb91a5fcc30cbd73fbfb59e889b147fc448a92e403e1b5963ec2

    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Nodejs
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: yarn install
        run: yarn install

      - name: List Bundle
        run: bundle list

      - name: Install Postgresql client and libffi
        run: sudo apt-get -yqq install libpq-dev libffi-dev

      - name: Install wkhtmltopdf
        run: sudo apt-get -yqq install wkhtmltopdf

      - name: Setup Database
        run: |
          cp config/database.github-actions.yml config/database.yml
          bundle exec rake parallel:create
          bundle exec rake parallel:load_schema
        env:
          RAILS_ENV: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      - name: Zeitwerk check
        run: bundle exec rails zeitwerk:check
        env:
          RAILS_ENV: test

      - name: JS build
        run: yarn build
        env:
          STRIPE_PUBLISHABLE_KEY: none
          STRIPE_SECRET_KEY: none
          STRIPE_MONTHLY_DONATION_PLAN: none
          STRIPE_ONE_TIME_PAYMENT_PRODUCT: none
          STRIPE_INVOICE_ENDPOINT_SECRET: none
          NODE_ENV: test
          RAILS_ENV: test

      - name: Run Rspec Tests
        run: bundle exec parallel_rspec spec
        env:
          COVERAGE: true
          RAILS_ENV: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          STRIPE_PUBLISHABLE_KEY: none
          STRIPE_SECRET_KEY: none
          STRIPE_MONTHLY_DONATION_PLAN: none
          STRIPE_ONE_TIME_PAYMENT_PRODUCT: none
          STRIPE_INVOICE_ENDPOINT_SECRET: none
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          path: tmp/capybara*/*.png
          if-no-files-found: ignore


      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
